<svg xmlns="http://www.w3.org/2000/svg" width="400" height="252" viewBox="0 0 400 252">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a3a5c"/>
      <stop offset="100%" stop-color="#2d5f8a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="252" rx="12" fill="url(#bg)"/>
  <rect x="12" y="12" width="376" height="228" rx="8" fill="none" stroke="#ffffff30" stroke-width="1"/>
  <!-- Header -->
  <text x="200" y="32" text-anchor="middle" fill="#ffd700" font-family="sans-serif" font-size="10" font-weight="bold">CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM</text>
  <text x="200" y="46" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="9">Độc lập — Tự do — Hạnh phúc</text>
  <text x="200" y="68" text-anchor="middle" fill="#ffd700" font-family="sans-serif" font-size="14" font-weight="bold">CĂN CƯỚC CÔNG DÂN</text>
  <!-- Photo placeholder -->
  <rect x="24" y="84" width="90" height="120" rx="4" fill="#ffffff20" stroke="#ffffff40"/>
  <text x="69" y="148" text-anchor="middle" fill="#ffffff80" font-family="sans-serif" font-size="24">📷</text>
  <!-- Info fields -->
  <text x="130" y="100" fill="#ffffffa0" font-family="sans-serif" font-size="9">Số / No:</text>
  <text x="130" y="114" fill="#fff" font-family="sans-serif" font-size="12" font-weight="bold">079 0XX XXX XXX</text>
  <text x="130" y="136" fill="#ffffffa0" font-family="sans-serif" font-size="9">Họ và tên / Full name:</text>
  <text x="130" y="150" fill="#fff" font-family="sans-serif" font-size="11" font-weight="bold">NGUYỄN THỊ HỒNG</text>
  <text x="130" y="170" fill="#ffffffa0" font-family="sans-serif" font-size="9">Ngày sinh / Date of birth:</text>
  <text x="130" y="183" fill="#fff" font-family="sans-serif" font-size="11">15/03/1988</text>
  <text x="280" y="170" fill="#ffffffa0" font-family="sans-serif" font-size="9">Giới tính:</text>
  <text x="280" y="183" fill="#fff" font-family="sans-serif" font-size="11">Nữ</text>
  <text x="24" y="224" fill="#ffffffa0" font-family="sans-serif" font-size="9">Ngày cấp: 20/01/2022 · CA TP.HCM</text>
  <!-- Chip -->
  <rect x="310" y="88" width="60" height="42" rx="4" fill="#c9a84c" stroke="#a8883a"/>
  <rect x="318" y="96" width="44" height="26" rx="2" fill="#dbb95c" stroke="#c9a84c"/>
  <!-- Watermark -->
  <text x="200" y="240" text-anchor="middle" fill="#ffffff15" font-family="sans-serif" font-size="10">MẪU MINH HỌA — WIREFRAME</text>
</svg>
